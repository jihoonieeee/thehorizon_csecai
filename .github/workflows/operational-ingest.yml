name: Operational ingest (web discovery + sitemaps)

on:
  schedule:
    # Monday 23:00 UTC — weekly web discovery + sitemap crawl
    - cron: '0 23 * * 1'
  workflow_dispatch:
    inputs:
      days:
        description: 'Lookback window in days (default 7)'
        default: '7'

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - name: Web discovery + sitemap crawl
        run: node scripts/ingestOperational.js --days ${{ github.event.inputs.days || '7' }} --skip-llm
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          TAVILY_API_KEY_2: ${{ secrets.TAVILY_API_KEY_2 }}
          TAVILY_API_KEY_3: ${{ secrets.TAVILY_API_KEY_3 }}
          TAVILY_API_KEY_4: ${{ secrets.TAVILY_API_KEY_4 }}
          SERPAPI_API_KEY: ${{ secrets.SERPAPI_API_KEY }}
          WEB_DISCOVERY_ENABLED: "1"
