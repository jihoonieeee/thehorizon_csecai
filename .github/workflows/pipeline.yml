name: Pipeline — L1–L5 + Insights

# One script per layer group. Jobs are chained via `needs:` so each stage
# starts immediately after the previous one finishes.
#
# Execution order:
#   connector-ingest ─┐
#                     ├──→  classify (L4a–f)  ──→  rescrape  ──→  evidence (L5)  ──→  insights
#   web-ingest       ─┘
#
# connector-ingest and web-ingest run in parallel. classify starts only after
# both finish, so it sees all sources from both paths in one pass.
#
# Schedule (all times UTC; SGT = UTC+8):
#   04:00 UTC daily  — pre-ingest buffer (12:00 SGT; arXiv low-traffic window)
#   16:00 UTC daily  — primary run (00:00 SGT midnight)
#   20:00 UTC daily  — backup run (04:00 SGT; fires 4h after primary)
#
# Only three cron entries exist. The ingest window (3 / 7 / 30 days) and which
# insights to generate (weekly / monthly / quarterly) are derived from the
# current date inside the preflight job — no duplicate concurrent runs.
#
# Backup behaviour: the preflight job queries the GitHub API at startup.
# If a successful run of this workflow already completed today since 15:00 UTC,
# the backup sets should_skip=true and every downstream job is skipped. This
# means a successful primary run consumes zero redundant API quota.
# If the primary was dropped by GHA or failed, the backup runs for real.

on:
  schedule:
    - cron: '0 4 * * *'    # pre-ingest buffer (12:00 SGT, arXiv low-traffic)
    - cron: '0 16 * * *'   # primary daily run (00:00 SGT midnight)
    - cron: '0 20 * * *'   # backup run (04:00 SGT) — skipped if primary succeeded
  workflow_dispatch:
    inputs:
      days:
        description: 'Connector ingest window in days (3 / 7 / 30)'
        default: '3'
      classify_limit:
        description: 'Max sources to classify (default 400)'
        default: '400'
      sig_limit:
        description: 'Max significance LLM calls (default 100)'
        default: '100'
      evidence_limit:
        description: 'Max sources for evidence extraction (default 150)'
        default: '150'
      run_insights:
        description: 'Generate dashboard insights (week|month|quarter|all)'
        type: string
        default: ''
      skip_web_ingest:
        description: 'Skip web discovery'
        type: boolean
        default: false

permissions:
  actions: read

jobs:
  # ── Preflight ─────────────────────────────────────────────────────────────────
  # Determines whether to skip (backup after successful primary) and computes
  # the ingest window and insights flags from the current date.
  # All downstream jobs gate on should_skip and consume the outputs.
  preflight:
    name: Preflight — window + skip check
    runs-on: ubuntu-latest
    outputs:
      should_skip:   ${{ steps.check.outputs.should_skip }}
      days:          ${{ steps.window.outputs.days }}
      run_weekly:    ${{ steps.window.outputs.run_weekly }}
      run_monthly:   ${{ steps.window.outputs.run_monthly }}
      run_quarterly: ${{ steps.window.outputs.run_quarterly }}
    steps:
      - name: Skip backup if primary already succeeded today
        id: check
        run: |
          # Only skip for the 20:00 scheduled backup; never skip manual dispatches
          # or the 04:00 / 16:00 runs.
          if [ "${{ github.event_name }}" != "schedule" ] || \
             [ "${{ github.event.schedule }}" != "0 20 * * *" ]; then
            echo "should_skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          TODAY=$(date -u +%Y-%m-%d)
          CUTOFF="${TODAY}T15:00:00Z"
          COUNT=$(gh api \
            "repos/${{ github.repository }}/actions/workflows/pipeline.yml/runs?status=success&per_page=20" \
            --jq "[.workflow_runs[] | select(.created_at > \"$CUTOFF\")] | length")
          if [ "$COUNT" -gt 0 ]; then
            echo "should_skip=true" >> "$GITHUB_OUTPUT"
            echo "Primary run already succeeded since $CUTOFF — backup will be skipped."
          else
            echo "should_skip=false" >> "$GITHUB_OUTPUT"
            echo "No successful run found since $CUTOFF — backup will proceed."
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Determine ingest window and insights flags
        id: window
        run: |
          # ── ingest window ───────────────────────────────────────────────
          if [ -n "${{ github.event.inputs.days }}" ]; then
            echo "days=${{ github.event.inputs.days }}" >> "$GITHUB_OUTPUT"
          else
            DAY_OF_WEEK=$(date -u +%u)   # 1=Mon … 7=Sun
            DAY_OF_MONTH=$(date -u +%-d) # 1–31, no leading zero
            if [ "$DAY_OF_MONTH" = "1" ]; then
              echo "days=30" >> "$GITHUB_OUTPUT"
            elif [ "$DAY_OF_WEEK" = "1" ]; then
              echo "days=7"  >> "$GITHUB_OUTPUT"
            else
              echo "days=3"  >> "$GITHUB_OUTPUT"
            fi
          fi

          # ── insights flags ──────────────────────────────────────────────
          RUN_INPUT="${{ github.event.inputs.run_insights }}"
          SCHEDULE="${{ github.event.schedule }}"

          if [ -n "$RUN_INPUT" ]; then
            # workflow_dispatch: honour explicit run_insights input
            echo "$RUN_INPUT" | grep -qE 'week|all'    && W=true || W=false
            echo "$RUN_INPUT" | grep -qE 'month|all'   && M=true || M=false
            echo "$RUN_INPUT" | grep -qE 'quarter|all' && Q=true || Q=false
          elif [ "$SCHEDULE" = "0 4 * * *" ]; then
            # Pre-ingest buffer never generates insights
            W=false; M=false; Q=false
          else
            # Scheduled primary / backup: derive from current date
            DAY_OF_WEEK=$(date -u +%u)
            DAY_OF_MONTH=$(date -u +%-d)
            MONTH=$(date -u +%-m)
            [ "$DAY_OF_WEEK"  = "1" ] && W=true || W=false
            [ "$DAY_OF_MONTH" = "1" ] && M=true || M=false
            if [ "$DAY_OF_MONTH" = "1" ] && \
               ([ "$MONTH" = "1" ] || [ "$MONTH" = "4" ] || \
                [ "$MONTH" = "7" ] || [ "$MONTH" = "10" ]); then
              Q=true
            else
              Q=false
            fi
          fi
          echo "run_weekly=$W"    >> "$GITHUB_OUTPUT"
          echo "run_monthly=$M"   >> "$GITHUB_OUTPUT"
          echo "run_quarterly=$Q" >> "$GITHUB_OUTPUT"

  # ── Job 1a: L1–L3 connector ingest ───────────────────────────────────────────
  # Runs arXiv, RSS, CISA KEV, GHSA and other registered connectors.
  # Saves sources to DB with validation_status set; main_category remains null.
  connector-ingest:
    name: L1–L3 Connector ingest
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: needs.preflight.outputs.should_skip != 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci

      - name: Run connector ingest (L1–L3)
        run: node scripts/ingest.js --days ${{ needs.preflight.outputs.days }}
        env:
          SUPABASE_URL:              ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          BLOB_READ_WRITE_TOKEN:     ${{ secrets.BLOB_READ_WRITE_TOKEN }}
          OPENAI_API_KEY:            ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY:            ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY:         ${{ secrets.ANTHROPIC_API_KEY }}
          CRON_SECRET:               ${{ secrets.CRON_SECRET }}
          ARXIV_INITIAL_DELAY_MS:    "90000"

  # ── Job 1b: Web discovery ingest ─────────────────────────────────────────────
  # Runs Tavily/SerpAPI + sitemaps, then Claude web_search.
  # Saves raw normalised sources to DB (main_category=null, validation_status=review).
  # Runs in parallel with connector-ingest.
  web-ingest:
    name: Web discovery ingest
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 55
    continue-on-error: true
    if: |
      needs.preflight.outputs.should_skip != 'true' &&
      github.event.inputs.skip_web_ingest != 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci

      - name: Tavily/SerpAPI + sitemaps
        run: node scripts/ingestOperational.js --days 7 --skip-llm
        env:
          SUPABASE_URL:              ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          BLOB_READ_WRITE_TOKEN:     ${{ secrets.BLOB_READ_WRITE_TOKEN }}
          ANTHROPIC_API_KEY:         ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY:            ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY:            ${{ secrets.OPENAI_API_KEY }}
          TAVILY_API_KEY:            ${{ secrets.TAVILY_API_KEY }}
          TAVILY_API_KEY_2:          ${{ secrets.TAVILY_API_KEY_2 }}
          TAVILY_API_KEY_3:          ${{ secrets.TAVILY_API_KEY_3 }}
          TAVILY_API_KEY_4:          ${{ secrets.TAVILY_API_KEY_4 }}
          SERPAPI_API_KEY:           ${{ secrets.SERPAPI_API_KEY }}
          EVA_API_KEY:               ${{ secrets.EVA_API_KEY }}
          WEB_DISCOVERY_ENABLED:     "1"

      - name: Claude web_search discovery
        run: node scripts/discoverOperationalSources.js --max-queries 4 --concurrency 2
        env:
          SUPABASE_URL:              ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ANTHROPIC_API_KEY:         ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY:            ${{ secrets.GEMINI_API_KEY }}
          WEB_DISCOVERY_ENABLED:     "1"

  # ── Job 2: L4a–f classify ────────────────────────────────────────────────────
  # Classifies ALL sources with main_category IS NULL — connector and web-discovery
  # sources from jobs 1a and 1b, plus any backlog from previous failed runs.
  classify:
    name: L4 Classify
    needs: [preflight, connector-ingest, web-ingest]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    if: |
      always() &&
      needs.preflight.outputs.should_skip != 'true' &&
      needs.connector-ingest.result == 'success' &&
      (needs.web-ingest.result == 'success' || needs.web-ingest.result == 'skipped' || needs.web-ingest.result == 'cancelled')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci

      - name: Run classify (L4a–f)
        run: |
          node scripts/classify.js \
            --limit ${{ github.event.inputs.classify_limit || '400' }} \
            --sig-limit ${{ github.event.inputs.sig_limit || '100' }}
        env:
          SUPABASE_URL:              ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          OPENAI_API_KEY:            ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY:            ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY:         ${{ secrets.ANTHROPIC_API_KEY }}

  # ── Job 2b: Rescrape short sources ───────────────────────────────────────────
  # Re-fetches article text for essential/recommended sources with < 600 chars.
  # Cascade: arXiv preprint (paywall domains) → direct → Jina → Tavily.
  # Sources that fail all methods are purged (digest children are exempt).
  # Runs after classify so reading_value is already set; before evidence so
  # recovered text is available for extraction in the same pipeline run.
  rescrape:
    name: Rescrape short sources
    needs: [preflight, classify]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: always() && needs.preflight.outputs.should_skip != 'true' && needs.classify.result == 'success'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci

      - name: Rescrape short sources + purge failures
        run: node scripts/rescrapeShortSources.js --min-chars 600 --limit 200 --purge-failed
        env:
          SUPABASE_URL:              ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          JINA_API_KEY:              ${{ secrets.JINA_API_KEY }}
          TAVILY_API_KEY:            ${{ secrets.TAVILY_API_KEY }}

  # ── Job 3: L5 evidence extraction ────────────────────────────────────────────
  # Extracts structured evidence items for newly eligible sources.
  # --since-hours 48 covers sources from this run plus a buffer for clock drift.
  evidence:
    name: L5 Evidence extraction
    needs: [preflight, classify, rescrape]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: always() && needs.preflight.outputs.should_skip != 'true' && needs.classify.result == 'success' && (needs.rescrape.result == 'success' || needs.rescrape.result == 'failure')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci

      - name: Run evidence extraction (L5)
        run: |
          node scripts/extractEvidence.js \
            --limit ${{ github.event.inputs.evidence_limit || '150' }} \
            --since-hours 48
        env:
          SUPABASE_URL:              ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ANTHROPIC_API_KEY:         ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY:            ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY:            ${{ secrets.OPENAI_API_KEY }}

  # ── Job 4: Dashboard insights ─────────────────────────────────────────────────
  # Per-category bullet-point insights. Idempotent by window_key × category.
  # Which windows to run (weekly / monthly / quarterly) is decided by preflight.
  # Skipped entirely on plain daily and pre-ingest buffer runs.
  insights:
    name: Dashboard insights
    needs: [preflight, evidence]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: |
      always() &&
      needs.preflight.outputs.should_skip != 'true' &&
      needs.evidence.result == 'success' && (
        needs.preflight.outputs.run_weekly    == 'true' ||
        needs.preflight.outputs.run_monthly   == 'true' ||
        needs.preflight.outputs.run_quarterly == 'true'
      )
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci

      - name: Weekly insights
        if: needs.preflight.outputs.run_weekly == 'true'
        run: node scripts/generateDashboardInsights.js --window week
        env:
          SUPABASE_URL:              ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ANTHROPIC_API_KEY:         ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Monthly insights
        if: needs.preflight.outputs.run_monthly == 'true'
        run: node scripts/generateDashboardInsights.js --window month
        env:
          SUPABASE_URL:              ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ANTHROPIC_API_KEY:         ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Quarterly insights
        if: needs.preflight.outputs.run_quarterly == 'true'
        run: node scripts/generateDashboardInsights.js --window quarter
        env:
          SUPABASE_URL:              ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ANTHROPIC_API_KEY:         ${{ secrets.ANTHROPIC_API_KEY }}
