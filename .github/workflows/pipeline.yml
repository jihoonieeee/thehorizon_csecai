name: Pipeline — Understand & Synthesize

# Schedule logic (all times UTC, SGT = UTC+8):
#
#   22:30 UTC daily   → Understand only (30 min after Vercel ingest at 22:00 UTC)
#   01:00 UTC Monday  → Understand + Synthesize 90d (1h after Vercel weekly ingest at 00:00 UTC)
#   01:00 UTC 1st     → Understand + Synthesize 365d (1h after Vercel monthly ingest at 00:00 UTC)
#
# Manual dispatch lets you run either step on demand with custom parameters.

on:
  schedule:
    - cron: '30 22 * * *'      # daily understanding (22:30 UTC = 06:30 SGT next day)
    - cron: '0 1 * * 1'        # weekly synthesis + insights (Monday 01:00 UTC = 09:00 SGT)
    - cron: '0 1 1 * *'        # monthly synthesis + insights (1st 01:00 UTC = 09:00 SGT)
    - cron: '0 0 1 1,4,7,10 *' # quarterly insights (1st Jan/Apr/Jul/Oct 00:00 UTC = 08:00 SGT)
  workflow_dispatch:
    inputs:
      run_synthesis:
        description: 'Run synthesis after understanding?'
        type: boolean
        default: false
      days:
        description: 'Synthesis lookback window in days (default: 90)'
        type: string
        default: '90'
      run_insights:
        description: 'Generate dashboard insights? (week|month|quarter|all)'
        type: string
        default: ''

jobs:
  # ── Job 1: Understand new sources ──────────────────────────────────────────────
  # Runs on every trigger. Processes only sources where claim_extraction_status
  # IS NULL — safe to re-run, skips already-understood sources automatically.
  understand:
    name: Understand new sources
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run understanding
        run: node scripts/understandCorpus.js --concurrency 3
        env:
          SUPABASE_URL:              ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ANTHROPIC_API_KEY:         ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY:            ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY:            ${{ secrets.OPENAI_API_KEY }}

  # ── Job 1b: Dashboard insights ────────────────────────────────────────────
  # Generates per-category bullet-point insights for the Overview page.
  # Idempotent: skips window_key × category rows that already exist.
  # Runs on: weekly (week insights), monthly (month + quarter if applicable),
  #          quarterly cron (quarter insights), manual dispatch with run_insights set.
  insights:
    name: Dashboard insights
    needs: understand
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: |
      (github.event_name == 'schedule' && github.event.schedule != '30 22 * * *') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.run_insights != '')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci

      - name: Weekly insights (Monday)
        if: github.event.schedule == '0 1 * * 1' || contains(github.event.inputs.run_insights, 'week') || github.event.inputs.run_insights == 'all'
        run: node scripts/generateDashboardInsights.js --window week
        env:
          SUPABASE_URL:              ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ANTHROPIC_API_KEY:         ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Monthly insights (1st of month)
        if: github.event.schedule == '0 1 1 * *' || contains(github.event.inputs.run_insights, 'month') || github.event.inputs.run_insights == 'all'
        run: node scripts/generateDashboardInsights.js --window month
        env:
          SUPABASE_URL:              ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ANTHROPIC_API_KEY:         ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Quarterly insights (1st Jan/Apr/Jul/Oct)
        if: github.event.schedule == '0 0 1 1,4,7,10 *' || contains(github.event.inputs.run_insights, 'quarter') || github.event.inputs.run_insights == 'all'
        run: node scripts/generateDashboardInsights.js --window quarter
        env:
          SUPABASE_URL:              ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ANTHROPIC_API_KEY:         ${{ secrets.ANTHROPIC_API_KEY }}

  # ── Job 2: Synthesize + QA ─────────────────────────────────────────────────
  # Runs after understanding completes, but only on weekly/monthly schedules
  # or when manually requested. Not run on the daily 22:30 schedule (too
  # expensive to synthesize the full corpus every day).
  synthesize:
    name: Synthesize & QA (${{ needs.understand.result == 'success' && 'after understand' || 'standalone' }})
    needs: understand
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Run on: weekly schedule | monthly schedule | manual dispatch with run_synthesis=true
    if: |
      (github.event_name == 'schedule' && github.event.schedule != '30 22 * * *') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.run_synthesis == 'true')
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Determine lookback window
        id: window
        run: |
          if [ "${{ github.event.schedule }}" = "0 1 1 * *" ]; then
            echo "days=365" >> "$GITHUB_OUTPUT"
            echo "label=monthly full-year" >> "$GITHUB_OUTPUT"
          elif [ -n "${{ github.event.inputs.days }}" ]; then
            echo "days=${{ github.event.inputs.days }}" >> "$GITHUB_OUTPUT"
            echo "label=manual ${{ github.event.inputs.days }}d" >> "$GITHUB_OUTPUT"
          else
            echo "days=90" >> "$GITHUB_OUTPUT"
            echo "label=weekly 90d" >> "$GITHUB_OUTPUT"
          fi

      - name: Run synthesis + second-model QA (${{ steps.window.outputs.label }})
        run: node scripts/runSynthesisOnly.js --days ${{ steps.window.outputs.days }}
        env:
          SUPABASE_URL:              ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          BLOB_READ_WRITE_TOKEN:     ${{ secrets.BLOB_READ_WRITE_TOKEN }}
          ANTHROPIC_API_KEY:         ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY:            ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY:            ${{ secrets.OPENAI_API_KEY }}
          GROQ_API_KEY:              ${{ secrets.GROQ_API_KEY }}
