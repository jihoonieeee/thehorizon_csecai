name: Pipeline — Enrich & Synthesize

# Schedule logic (all times UTC, SGT = UTC+8):
#
#   22:30 UTC daily   → Enrich only (30 min after Vercel ingest at 22:00 UTC)
#   01:00 UTC Monday  → Enrich + Synthesize 90d (1h after Vercel weekly ingest at 00:00 UTC)
#   01:00 UTC 1st     → Enrich + Synthesize 365d (1h after Vercel monthly ingest at 00:00 UTC)
#
# Manual dispatch lets you run either step on demand with custom parameters.

on:
  schedule:
    - cron: '30 22 * * *'   # daily enrichment
    - cron: '0 1 * * 1'     # weekly synthesis (Monday 09:00 SGT)
    - cron: '0 1 1 * *'     # monthly synthesis (1st of month 09:00 SGT)
  workflow_dispatch:
    inputs:
      run_synthesis:
        description: 'Run synthesis after enrichment?'
        type: boolean
        default: false
      days:
        description: 'Synthesis lookback window in days (default: 90)'
        type: string
        default: '90'

jobs:
  # ── Job 1: Enrich new sources ──────────────────────────────────────────────
  # Runs on every trigger. Processes only sources where claim_extraction_status
  # IS NULL — safe to re-run, skips already-enriched sources automatically.
  enrich:
    name: Enrich new sources
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run enrichment
        run: node scripts/enrichCorpus.js --concurrency 3
        env:
          SUPABASE_URL:              ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ANTHROPIC_API_KEY:         ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY:            ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY:            ${{ secrets.OPENAI_API_KEY }}

  # ── Job 2: Synthesize + QA ─────────────────────────────────────────────────
  # Runs after enrichment completes, but only on weekly/monthly schedules
  # or when manually requested. Not run on the daily 22:30 schedule (too
  # expensive to synthesize the full corpus every day).
  synthesize:
    name: Synthesize & QA (${{ needs.enrich.result == 'success' && 'after enrich' || 'standalone' }})
    needs: enrich
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Run on: weekly schedule | monthly schedule | manual dispatch with run_synthesis=true
    if: |
      (github.event_name == 'schedule' && github.event.schedule != '30 22 * * *') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.run_synthesis == 'true')
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Determine lookback window
        id: window
        run: |
          if [ "${{ github.event.schedule }}" = "0 1 1 * *" ]; then
            echo "days=365" >> "$GITHUB_OUTPUT"
            echo "label=monthly full-year" >> "$GITHUB_OUTPUT"
          elif [ -n "${{ github.event.inputs.days }}" ]; then
            echo "days=${{ github.event.inputs.days }}" >> "$GITHUB_OUTPUT"
            echo "label=manual ${{ github.event.inputs.days }}d" >> "$GITHUB_OUTPUT"
          else
            echo "days=90" >> "$GITHUB_OUTPUT"
            echo "label=weekly 90d" >> "$GITHUB_OUTPUT"
          fi

      - name: Run synthesis + second-model QA (${{ steps.window.outputs.label }})
        run: node scripts/runSynthesisOnly.js --days ${{ steps.window.outputs.days }}
        env:
          SUPABASE_URL:              ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          BLOB_READ_WRITE_TOKEN:     ${{ secrets.BLOB_READ_WRITE_TOKEN }}
          ANTHROPIC_API_KEY:         ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY:            ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY:            ${{ secrets.OPENAI_API_KEY }}
          GROQ_API_KEY:              ${{ secrets.GROQ_API_KEY }}
