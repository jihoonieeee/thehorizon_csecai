name: Pipeline — L1–L5 + Insights

# One script per layer group. Jobs are chained via `needs:` so each stage
# starts immediately after the previous one finishes.
#
# Execution order:
#   connector-ingest ─┐
#                     ├──→  classify (L4a–f)  ──→  evidence (L5)  ──→  insights
#   web-ingest       ─┘
#
# connector-ingest and web-ingest run in parallel. classify starts only after
# both finish, so it sees all sources from both paths in one pass.
#
# Schedule (all times UTC):
#   04:00 daily  — backup run (arXiv low-traffic; GHA drops ~1 cron/day on Hobby plan)
#   10:00 daily  — backup run (second window, 8h before primary)
#   22:00 daily  — primary run (3d window)
#   22:00 Monday — primary run (7d window) + weekly insights
#   22:00 1st of month    — primary run (30d window) + monthly insights
#   22:00 quarterly 1st   — same as monthly + quarterly insights
#
# Backup runs (04:00, 10:00) use the same 3-day window as the daily primary.
# They are idempotent: classify/evidence gate on NULL fields so a backup that
# finds nothing to do exits in seconds.

on:
  schedule:
    - cron: '0 4 * * *'           # daily backup — arXiv low-traffic window
    - cron: '0 10 * * *'          # daily backup — second window
    - cron: '0 22 * * *'          # daily primary
    - cron: '0 22 * * 1'          # Monday  — 7-day window
    - cron: '0 22 1 * *'          # 1st of month — 30-day window
    - cron: '0 22 1 1,4,7,10 *'   # quarterly 1st
  workflow_dispatch:
    inputs:
      days:
        description: 'Connector ingest window in days (3 / 7 / 30)'
        default: '3'
      classify_limit:
        description: 'Max sources to classify (default 200)'
        default: '200'
      sig_limit:
        description: 'Max significance LLM calls (default 100)'
        default: '100'
      evidence_limit:
        description: 'Max sources for evidence extraction (default 150)'
        default: '150'
      run_insights:
        description: 'Generate dashboard insights (week|month|quarter|all)'
        type: string
        default: ''
      skip_web_ingest:
        description: 'Skip web discovery'
        type: boolean
        default: false

jobs:
  # ── Job 1a: L1–L3 connector ingest ───────────────────────────────────────────
  # Runs arXiv, RSS, CISA KEV, GHSA and other registered connectors.
  # Saves sources to DB with validation_status set; main_category remains null.
  connector-ingest:
    name: L1–L3 Connector ingest
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci

      - name: Determine ingest window
        id: window
        run: |
          if [ -n "${{ github.event.inputs.days }}" ]; then
            echo "days=${{ github.event.inputs.days }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "0 22 1 * *" ] || [ "${{ github.event.schedule }}" = "0 22 1 1,4,7,10 *" ]; then
            echo "days=30" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "0 22 * * 1" ]; then
            echo "days=7" >> "$GITHUB_OUTPUT"
          else
            echo "days=3" >> "$GITHUB_OUTPUT"
          fi

      - name: Run connector ingest (L1–L3)
        run: node scripts/ingest.js --days ${{ steps.window.outputs.days }}
        env:
          SUPABASE_URL:              ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          BLOB_READ_WRITE_TOKEN:     ${{ secrets.BLOB_READ_WRITE_TOKEN }}
          OPENAI_API_KEY:            ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY:            ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY:         ${{ secrets.ANTHROPIC_API_KEY }}
          CRON_SECRET:               ${{ secrets.CRON_SECRET }}
          ARXIV_INITIAL_DELAY_MS:    "90000"

  # ── Job 1b: Web discovery ingest ─────────────────────────────────────────────
  # Runs Tavily/SerpAPI + sitemaps, then Claude web_search.
  # Saves raw normalised sources to DB (main_category=null, validation_status=review).
  # Runs in parallel with connector-ingest.
  web-ingest:
    name: Web discovery ingest
    runs-on: ubuntu-latest
    timeout-minutes: 55
    continue-on-error: true
    if: github.event.inputs.skip_web_ingest != 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci

      - name: Tavily/SerpAPI + sitemaps
        run: node scripts/ingestOperational.js --days 7 --skip-llm
        env:
          SUPABASE_URL:              ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          BLOB_READ_WRITE_TOKEN:     ${{ secrets.BLOB_READ_WRITE_TOKEN }}
          ANTHROPIC_API_KEY:         ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY:            ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY:            ${{ secrets.OPENAI_API_KEY }}
          TAVILY_API_KEY:            ${{ secrets.TAVILY_API_KEY }}
          TAVILY_API_KEY_2:          ${{ secrets.TAVILY_API_KEY_2 }}
          TAVILY_API_KEY_3:          ${{ secrets.TAVILY_API_KEY_3 }}
          TAVILY_API_KEY_4:          ${{ secrets.TAVILY_API_KEY_4 }}
          SERPAPI_API_KEY:           ${{ secrets.SERPAPI_API_KEY }}
          EVA_API_KEY:               ${{ secrets.EVA_API_KEY }}
          WEB_DISCOVERY_ENABLED:     "1"

      - name: Claude web_search discovery
        run: node scripts/discoverOperationalSources.js --max-queries 4 --concurrency 2
        env:
          SUPABASE_URL:              ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ANTHROPIC_API_KEY:         ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY:            ${{ secrets.GEMINI_API_KEY }}
          WEB_DISCOVERY_ENABLED:     "1"

  # ── Job 2: L4a–f classify ────────────────────────────────────────────────────
  # Classifies ALL sources with main_category IS NULL — connector and web-discovery
  # sources from jobs 1a and 1b, plus any backlog from previous failed runs.
  classify:
    name: L4 Classify
    needs: [connector-ingest, web-ingest]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    if: |
      always() &&
      needs.connector-ingest.result == 'success' &&
      (needs.web-ingest.result == 'success' || needs.web-ingest.result == 'skipped' || needs.web-ingest.result == 'cancelled')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci

      - name: Run classify (L4a–f)
        run: |
          node scripts/classify.js \
            --limit ${{ github.event.inputs.classify_limit || '400' }} \
            --sig-limit ${{ github.event.inputs.sig_limit || '100' }}
        env:
          SUPABASE_URL:              ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          OPENAI_API_KEY:            ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY:            ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY:         ${{ secrets.ANTHROPIC_API_KEY }}

  # ── Job 2b: Rescrape short sources ───────────────────────────────────────────
  # Re-fetches article text for essential/recommended sources with < 600 chars.
  # Cascade: arXiv preprint (paywall domains) → direct → Jina → Tavily.
  # Sources that fail all methods are purged (digest children are exempt).
  # Runs after classify so reading_value is already set; before evidence so
  # recovered text is available for extraction in the same pipeline run.
  rescrape:
    name: Rescrape short sources
    needs: classify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci

      - name: Rescrape short sources + purge failures
        run: node scripts/rescrapeShortSources.js --min-chars 600 --limit 200 --purge-failed
        env:
          SUPABASE_URL:              ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          JINA_API_KEY:              ${{ secrets.JINA_API_KEY }}
          TAVILY_API_KEY:            ${{ secrets.TAVILY_API_KEY }}

  # ── Job 3: L5 evidence extraction ────────────────────────────────────────────
  # Extracts structured evidence items for newly eligible sources.
  # --since-hours 26 covers sources from this run plus a buffer for clock drift.
  evidence:
    name: L5 Evidence extraction
    needs: [classify, rescrape]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: always() && needs.classify.result == 'success' && (needs.rescrape.result == 'success' || needs.rescrape.result == 'failure')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci

      - name: Run evidence extraction (L5)
        run: |
          node scripts/extractEvidence.js \
            --limit ${{ github.event.inputs.evidence_limit || '150' }} \
            --since-hours 48
        env:
          SUPABASE_URL:              ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ANTHROPIC_API_KEY:         ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY:            ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY:            ${{ secrets.OPENAI_API_KEY }}

  # ── Job 4: Dashboard insights ─────────────────────────────────────────────────
  # Per-category bullet-point insights. Idempotent by window_key × category.
  # Skipped on the plain daily cron; only runs weekly/monthly/quarterly.
  insights:
    name: Dashboard insights
    needs: evidence
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: |
      always() && needs.evidence.result == 'success' && (
        (github.event_name == 'schedule' && (
          github.event.schedule == '0 22 * * 1' ||
          github.event.schedule == '0 22 1 * *' ||
          github.event.schedule == '0 22 1 1,4,7,10 *'
        )) ||
        (github.event_name == 'workflow_dispatch' && github.event.inputs.run_insights != '')
      )
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci

      - name: Weekly insights
        if: github.event.schedule == '0 22 * * 1' || contains(github.event.inputs.run_insights, 'week') || github.event.inputs.run_insights == 'all'
        run: node scripts/generateDashboardInsights.js --window week
        env:
          SUPABASE_URL:              ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ANTHROPIC_API_KEY:         ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Monthly insights
        if: github.event.schedule == '0 22 1 * *' || github.event.schedule == '0 22 1 1,4,7,10 *' || contains(github.event.inputs.run_insights, 'month') || github.event.inputs.run_insights == 'all'
        run: node scripts/generateDashboardInsights.js --window month
        env:
          SUPABASE_URL:              ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ANTHROPIC_API_KEY:         ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Quarterly insights
        if: github.event.schedule == '0 22 1 1,4,7,10 *' || contains(github.event.inputs.run_insights, 'quarter') || github.event.inputs.run_insights == 'all'
        run: node scripts/generateDashboardInsights.js --window quarter
        env:
          SUPABASE_URL:              ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ANTHROPIC_API_KEY:         ${{ secrets.ANTHROPIC_API_KEY }}
