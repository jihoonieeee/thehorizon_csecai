name: Generate Slides

# Slide decks are pre-generated on a schedule so the dashboard can offer instant
# downloads (no on-demand user trigger). Decks cover fixed, previous-complete
# calendar windows (see scripts/generateSlides.js → getCompletedPeriodWindow).
#
# Cadence: month every month, quarter each Jan/Apr/Jul/Oct, year each Jan. The
# quarterly (~90d) and yearly (365d) intervals both exceed GitHub's 60-day
# inactivity auto-disable, so rather than quarterly/yearly crons we fire a single
# MONTHLY cron and let scripts/dueReportWindows.js decide which windows are due
# that day — the trigger stays frequent enough to stay enabled, but only does
# real work at the start of the correct period.
#
# Primary at 18:00 UTC (1st); backup at 22:00 UTC (1st, 4h later). The backup
# passes --skip-if-exists, so if the primary already produced each due deck it
# exits in seconds with zero LLM calls; it only regenerates windows the primary
# dropped. Times are UTC; the window covers the PREVIOUS complete period (already
# ingested over prior days), so exact timing is not critical.
#
# workflow_dispatch remains for development/testing only.

on:
  schedule:
    - cron: '0 23 28-31 * *' # primary — last day of month 23:00 UTC (07:00 SGT 1st)
    - cron: '0 3 1 * *'     # backup  — 1st 03:00 UTC (11:00 SGT); --skip-if-exists
  workflow_dispatch:
    inputs:
      window:
        description: 'Reporting period (previous complete calendar month/quarter/year)'
        type: choice
        options:
          - month
          - quarter
          - year
        default: month
      from:
        description: 'Custom start date (YYYY-MM-DD) — overrides window'
        default: ''
      to:
        description: 'Custom end date (YYYY-MM-DD) — overrides window'
        default: ''
      category:
        description: 'Single category only (leave blank for all)'
        default: ''
      skip_qa:
        description: 'Skip entailment QA (faster)'
        type: boolean
        default: false

jobs:
  slides:
    name: Generate PPTX
    runs-on: ubuntu-latest
    # January generates up to three decks (month + quarter + year) sequentially,
    # each up to ~30 min; give the job generous headroom.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      # Decide which windows to generate and whether this is a backup run.
      #   scheduled  → windows due today (dueReportWindows.js); backup cron adds --skip-if-exists
      #   dispatch   → the chosen window, or a __custom__ sentinel for --from/--to
      - name: Plan run
        id: plan
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ -n "${{ github.event.inputs.from }}" ] && [ -n "${{ github.event.inputs.to }}" ]; then
              echo "windows=__custom__" >> "$GITHUB_OUTPUT"
            else
              echo "windows=${{ github.event.inputs.window || 'month' }}" >> "$GITHUB_OUTPUT"
            fi
            echo "skip=" >> "$GITHUB_OUTPUT"
          else
            # Guard: primary cron fires days 28-31; only proceed on the actual last day
            LAST_DAY=$(date -u -d "$(date -u +%Y-%m-01) +1 month -1 day" +%-d)
            TODAY=$(date -u +%-d)
            if [ "${{ github.event.schedule }}" = "0 23 28-31 * *" ] && [ "$TODAY" != "$LAST_DAY" ]; then
              echo "windows=skip" >> "$GITHUB_OUTPUT"
              echo "skip=" >> "$GITHUB_OUTPUT"
            else
              echo "windows=$(node scripts/dueReportWindows.js)" >> "$GITHUB_OUTPUT"
              if [ "${{ github.event.schedule }}" = "0 3 1 * *" ]; then
                echo "skip=--skip-if-exists" >> "$GITHUB_OUTPUT"
              else
                echo "skip=" >> "$GITHUB_OUTPUT"
              fi
            fi
          fi

      - name: Generate slides
        if: steps.plan.outputs.windows != 'skip'
        run: |
          COMMON=""
          if [ -n "${{ github.event.inputs.category }}" ]; then
            COMMON="$COMMON --category ${{ github.event.inputs.category }}"
          fi
          if [ "${{ github.event.inputs.skip_qa }}" = "true" ]; then
            COMMON="$COMMON --skip-qa"
          fi

          if [ "${{ steps.plan.outputs.windows }}" = "__custom__" ]; then
            node scripts/generateSlides.js \
              --from ${{ github.event.inputs.from }} --to ${{ github.event.inputs.to }} \
              $COMMON --out output/deck-custom.pptx
          else
            for w in ${{ steps.plan.outputs.windows }}; do
              echo "::group::Generating $w deck"
              node scripts/generateSlides.js \
                --window "$w" ${{ steps.plan.outputs.skip }} \
                $COMMON --out "output/deck-$w.pptx"
              echo "::endgroup::"
            done
          fi
        env:
          SUPABASE_URL:              ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          BLOB_READ_WRITE_TOKEN:     ${{ secrets.BLOB_READ_WRITE_TOKEN }}
          PLATFORM_AI_API_KEY:       ${{ secrets.PLATFORM_AI_API_KEY }}
          PROXY_URL:                 ${{ secrets.PROXY_URL }}
          LLM_PROVIDER_ORDER:        platform
          PLATFORM_AI_PROVIDER:      platform_ai
          PLATFORM_PIPELINE_MODEL:   gpt-5.4
          PLATFORM_MODEL_SYNTHESIS:  gpt-5.4
          PLATFORM_API_BASE_URL:     https://api-public.ai.tech.gov.sg
          LLM_TIMEOUT_MS:            "120000"

      - name: Upload decks
        uses: actions/upload-artifact@v4
        with:
          name: horizon-scan-decks
          path: |
            output/deck-*.pptx
            output/deck-*.json
            output/deck-*.md
          retention-days: 30
          if-no-files-found: ignore