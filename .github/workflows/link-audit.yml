name: Source Link Audit (dead-link + duplicate prune)

# Catches link ROT — sources that were reachable at ingest but have since 404'd
# (site migrations, pulled articles) — which the ingest-time Layer 3.5 check
# cannot see. Also prunes URL-variant duplicates that slipped in. Confirmed-dead
# only (404/410/DNS-failure via HEAD→GET); transient errors (timeout/5xx/429)
# are treated as indeterminate and never purge a real source. Curated sources
# are always protected.
#
# Schedule: daily at 03:00 UTC. Manual runs default to dry-run (report only) for safety.

on:
  schedule:
    - cron: '0 3 * * *'   # daily 03:00 UTC
  workflow_dispatch:
    inputs:
      execute:
        description: 'Actually delete (unchecked = dry-run report only)'
        type: boolean
        default: false

jobs:
  audit:
    name: Audit source links
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Run link audit
        # Scheduled runs execute; manual runs honour the execute input (default dry).
        run: node scripts/auditSourceLinks.js ${{ (github.event_name == 'schedule' || github.event.inputs.execute == 'true') && '--execute' || '' }}
        env:
          SUPABASE_URL:              ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

  feed-audit:
    name: Audit + heal registry feeds
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci

      - name: Probe feeds + auto-heal / auto-disable
        # Recovery ladder per dead feed:
        #   1. Feed autodiscovery (scrape homepage for <link rel="alternate">)
        #   2. Google News RSS proxy (works for Cloudflare-blocked news sites)
        #   3. Jina proxy (r.jina.ai)
        # Confirmed-dead (404/DNS) with no working recovery → enabled: false
        # Uncertain (403/5xx/timeout) → warn only, never auto-disabled
        run: node scripts/auditFeeds.js --auto-fix

      - name: Commit healed/disabled feeds
        # Only commits if sourceRegistry.js was actually changed by --auto-fix
        run: |
          git diff --quiet lib/pipeline/ingest/sourceRegistry.js && echo "No registry changes." && exit 0
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add lib/pipeline/ingest/sourceRegistry.js
          git commit -m "chore: auto-heal/disable dead registry feeds (auditFeeds)"
          git push
