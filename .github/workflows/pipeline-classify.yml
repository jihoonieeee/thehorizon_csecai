name: Pipeline — Classify + Evidence + Insights

# Runs classify (L4), rescrape, evidence (L5), and dashboard insights.
# Fires 90 min after each ingest window opens, giving connectors time to finish
# even on slow runs (rate-limited fetches, large RSS backlogs).
#
# Schedule (UTC; SGT = UTC+8):
#   05:30 — after the 04:00 connector + arXiv window (arXiv watchdog exits by 04:55)
#   17:30 — after the 16:00 connector window (90-min safety margin)
#   21:30 — after the 20:00 connector window (backup slot, 90-min safety margin)
#
# Skip logic for 17:30 and 21:30 slots (05:30 always runs):
#   Skip if classify already succeeded after the previous ingest slot AND
#   no new connector run happened in the current ingest slot.
#   This makes 17:30 and 21:30 true backups rather than unconditional runs.
#
# Insights are generated at 17:30 and 21:30 on weekly/monthly/quarterly triggers.
# The 05:30 slot never generates insights (equivalent to the old pre-ingest buffer).

on:
  schedule:
    - cron: '30 5 * * *'   # after 04:00 connectors + arXiv
    - cron: '30 17 * * *'  # after 16:00 connectors (90-min margin)
    - cron: '30 21 * * *'  # after 20:00 connectors (backup, 90-min margin)
  workflow_dispatch:
    inputs:
      classify_limit:
        description: 'Max sources to classify (default 400)'
        default: '400'
      sig_limit:
        description: 'Max significance LLM calls (default 100)'
        default: '100'
      evidence_limit:
        description: 'Max sources for evidence extraction (default 150)'
        default: '150'
      run_insights:
        description: 'Generate dashboard insights (week|month|quarter|all)'
        type: string
        default: ''

permissions:
  actions: read

env:
  LLM_PROVIDER_ORDER:       platform
  PLATFORM_AI_PROVIDER:     platform_ai
  PLATFORM_PIPELINE_MODEL:  gpt-5.4
  PLATFORM_MODEL_SYNTHESIS: gpt-5.4
  PLATFORM_API_BASE_URL:    https://api-public.ai.tech.gov.sg
  # L4 classify (~400 sources × ~1500 tokens) + L5 evidence (~150 sources × ~2500 tokens)
  # + insights synthesis (~4 categories). 2M is a ~2× ceiling on a full run.
  LLM_DAILY_TOKEN_BUDGET: '2000000'

jobs:
  preflight:
    name: Preflight — skip check + insights flags
    runs-on: ubuntu-latest
    outputs:
      should_skip:   ${{ steps.check.outputs.should_skip }}
      run_weekly:    ${{ steps.flags.outputs.run_weekly }}
      run_monthly:   ${{ steps.flags.outputs.run_monthly }}
      run_quarterly: ${{ steps.flags.outputs.run_quarterly }}
    steps:
      - name: Skip if previous classify succeeded and no new connector ingest
        id: check
        run: |
          # 05:30 always runs. Manual dispatches always run.
          # 17:30 skips if classify already succeeded since 05:00 UTC AND
          #        connectors did not succeed since 15:30 UTC (16:00 slot skipped).
          # 21:30 skips if classify already succeeded since 17:00 UTC AND
          #        connectors did not succeed since 19:30 UTC (20:00 slot skipped).
          SCHEDULE="${{ github.event.schedule }}"
          if [ "${{ github.event_name }}" != "schedule" ] || \
             [ "$SCHEDULE" = "30 5 * * *" ]; then
            echo "should_skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          TODAY=$(date -u +%Y-%m-%d)
          if [ "$SCHEDULE" = "30 17 * * *" ]; then
            CLASSIFY_CUTOFF="${TODAY}T05:00:00Z"
            CONNECTOR_CUTOFF="${TODAY}T15:30:00Z"
          else
            CLASSIFY_CUTOFF="${TODAY}T17:00:00Z"
            CONNECTOR_CUTOFF="${TODAY}T19:30:00Z"
          fi
          CLASSIFY_OK=$(gh api \
            "repos/${{ github.repository }}/actions/workflows/pipeline-classify.yml/runs?status=success&per_page=10" \
            --jq "[.workflow_runs[] | select(.created_at > \"$CLASSIFY_CUTOFF\")] | length")
          CONNECTOR_NEW=$(gh api \
            "repos/${{ github.repository }}/actions/workflows/pipeline-connectors.yml/runs?status=success&per_page=10" \
            --jq "[.workflow_runs[] | select(.created_at > \"$CONNECTOR_CUTOFF\")] | length")
          if [ "$CLASSIFY_OK" -gt 0 ] && [ "$CONNECTOR_NEW" -eq 0 ]; then
            echo "should_skip=true" >> "$GITHUB_OUTPUT"
            echo "Classify already succeeded and no new connector ingest — skipping backup slot."
          else
            echo "should_skip=false" >> "$GITHUB_OUTPUT"
            if [ "$CLASSIFY_OK" -eq 0 ]; then
              echo "Previous classify did not succeed — running backup."
            else
              echo "New connector ingest detected — classifying new sources."
            fi
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Compute insights flags
        id: flags
        run: |
          RUN_INPUT="${{ github.event.inputs.run_insights }}"
          SCHEDULE="${{ github.event.schedule }}"

          if [ -n "$RUN_INPUT" ]; then
            echo "$RUN_INPUT" | grep -qE 'week|all'    && W=true || W=false
            echo "$RUN_INPUT" | grep -qE 'month|all'   && M=true || M=false
            echo "$RUN_INPUT" | grep -qE 'quarter|all' && Q=true || Q=false
          elif [ "$SCHEDULE" = "30 5 * * *" ]; then
            # 05:30 slot mirrors the old pre-ingest buffer — no insights
            W=false; M=false; Q=false
          else
            # 17:30 and 21:30 slots generate insights on weekly/monthly/quarterly days
            DAY_OF_WEEK=$(date -u +%u)
            DAY_OF_MONTH=$(date -u +%-d)
            MONTH=$(date -u +%-m)
            # Last day of current month (SGT anchor: last day UTC = 1st SGT next morning)
            LAST_DAY_OF_MONTH=$(date -u -d "$(date -u +%Y-%m-01) +1 month -1 day" +%-d)
            [ "$DAY_OF_WEEK"  = "1" ] && W=true || W=false
            [ "$DAY_OF_MONTH" = "$LAST_DAY_OF_MONTH" ] && M=true || M=false
            if [ "$M" = "true" ] && \
               ([ "$MONTH" = "3" ] || [ "$MONTH" = "6" ] || \
                [ "$MONTH" = "9" ] || [ "$MONTH" = "12" ]); then
              Q=true
            else
              Q=false
            fi
          fi
          echo "run_weekly=$W"    >> "$GITHUB_OUTPUT"
          echo "run_monthly=$M"   >> "$GITHUB_OUTPUT"
          echo "run_quarterly=$Q" >> "$GITHUB_OUTPUT"

  classify:
    name: L4 Classify
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 90
    if: needs.preflight.outputs.should_skip != 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci

      - name: Run classify (L4a–f)
        run: |
          node scripts/classify.js \
            --limit ${{ github.event.inputs.classify_limit || '400' }} \
            --sig-limit ${{ github.event.inputs.sig_limit || '100' }}
        env:
          SUPABASE_URL:              ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PLATFORM_AI_API_KEY:       ${{ secrets.PLATFORM_AI_API_KEY }}
          PROXY_URL:                 ${{ secrets.PROXY_URL }}

  rescrape:
    name: Rescrape short sources
    needs: classify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: always() && needs.classify.result == 'success'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci

      - name: Rescrape short sources + purge failures
        run: node scripts/rescrapeShortSources.js --min-chars 600 --limit 200 --purge-failed
        env:
          SUPABASE_URL:              ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          JINA_API_KEY:              ${{ secrets.JINA_API_KEY }}
          TAVILY_API_KEY:            ${{ secrets.TAVILY_API_KEY }}

  evidence:
    name: L5 Evidence extraction
    needs: [classify, rescrape]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: always() && needs.classify.result == 'success' && (needs.rescrape.result == 'success' || needs.rescrape.result == 'failure')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci

      - name: Run evidence extraction (L5)
        run: |
          node scripts/extractEvidence.js \
            --limit ${{ github.event.inputs.evidence_limit || '150' }} \
            --since-hours 48
        env:
          SUPABASE_URL:              ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PLATFORM_AI_API_KEY:       ${{ secrets.PLATFORM_AI_API_KEY }}
          PROXY_URL:                 ${{ secrets.PROXY_URL }}

  insights:
    name: Dashboard insights
    needs: [preflight, evidence]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: |
      always() &&
      needs.evidence.result == 'success' && (
        needs.preflight.outputs.run_weekly    == 'true' ||
        needs.preflight.outputs.run_monthly   == 'true' ||
        needs.preflight.outputs.run_quarterly == 'true'
      )
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci

      - name: Weekly insights
        if: needs.preflight.outputs.run_weekly == 'true'
        run: node scripts/generateDashboardInsights.js --window week
        env:
          SUPABASE_URL:              ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PLATFORM_AI_API_KEY:       ${{ secrets.PLATFORM_AI_API_KEY }}
          PROXY_URL:                 ${{ secrets.PROXY_URL }}

      - name: Monthly insights
        if: needs.preflight.outputs.run_monthly == 'true'
        run: node scripts/generateDashboardInsights.js --window month
        env:
          SUPABASE_URL:              ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PLATFORM_AI_API_KEY:       ${{ secrets.PLATFORM_AI_API_KEY }}
          PROXY_URL:                 ${{ secrets.PROXY_URL }}

      - name: Quarterly insights
        if: needs.preflight.outputs.run_quarterly == 'true'
        run: node scripts/generateDashboardInsights.js --window quarter
        env:
          SUPABASE_URL:              ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PLATFORM_AI_API_KEY:       ${{ secrets.PLATFORM_AI_API_KEY }}
          PROXY_URL:                 ${{ secrets.PROXY_URL }}

      - name: Run health summary
        if: always()
        run: node scripts/ingestRunSummary.js --stage classify
        env:
          SUPABASE_URL:              ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
