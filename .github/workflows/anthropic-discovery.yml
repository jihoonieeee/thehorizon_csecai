name: Anthropic Web Discovery (daily)

# Claude web_search-backed discovery — complements the Tavily/SerpAPI run in
# operational-discovery.yml. The LLM reads and reasons about search results
# rather than returning raw keyword matches, which surfaces incident reports,
# attribution, and novel techniques that keyword search misses.
#
# Focused on the 7 most operationally-relevant missions only:
#   - emerging_threats_this_week   (breaking incidents, this week)
#   - new_incident_or_case_study   (IR write-ups, confirmed attacks)
#   - new_actor_adoption           (adversary / nation-state AI use)
#   - new_ai_enabled_cybercrime    (deepfake fraud, AI phishing, AI malware)
#   - fresh_attack_modes           (new techniques, fresh PoCs)
#   - ai_enabled_adversary_campaigns (confirmed real-world AI campaign use)
#   - new_ai_supply_chain_compromise (malicious models, poisoned deps)
#
# Runs once daily at 23:30 UTC (after the Vercel ingest + daily-classify).
# Sources are classified by the next daily-classify run (~22:30 UTC next day).

on:
  schedule:
    - cron: '30 23 * * *'
  workflow_dispatch:
    inputs:
      missions:
        description: 'Comma-separated mission names (leave blank for defaults)'
        default: ''
      max_queries:
        description: 'Max queries per mission'
        default: '4'

jobs:
  anthropic-discover:
    name: Anthropic web discovery
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      - name: Run Anthropic web discovery
        run: |
          MISSIONS="${{ github.event.inputs.missions || 'emerging_threats_this_week,new_incident_or_case_study,new_actor_adoption,new_ai_enabled_cybercrime,fresh_attack_modes,ai_enabled_adversary_campaigns,new_ai_supply_chain_compromise' }}"
          node scripts/discoverOperationalSources.js \
            --missions "$MISSIONS" \
            --max-queries ${{ github.event.inputs.max_queries || '4' }} \
            --concurrency 2
        env:
          SUPABASE_URL:              ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          BLOB_READ_WRITE_TOKEN:     ${{ secrets.BLOB_READ_WRITE_TOKEN }}
          ANTHROPIC_API_KEY:         ${{ secrets.ANTHROPIC_API_KEY }}
          WEB_DISCOVERY_ENABLED:     "1"
